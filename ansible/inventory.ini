# Inventory for deploying Claude Code config to every instance you run.
#
# The "mac-local" host runs against THIS machine with no SSH.
# Fill in your Rocky Linux servers below (uncomment + edit host/IP/user).

[claude_instances]
mac-local ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[claude_instances:children]
rocky_servers

[rocky_servers]
# rocky1 ansible_host=10.0.0.11 ansible_user=justin
# rocky2 ansible_host=10.0.0.12 ansible_user=justin
# rocky3 ansible_host=rocky3.example.com ansible_user=justin

[rocky_servers:vars]
# SSH defaults for all Rocky hosts; override per-host above as needed.
ansible_python_interpreter=/usr/bin/python3
